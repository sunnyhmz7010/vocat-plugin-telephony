name: Bug Report / 缺陷反馈
description: Report a reproducible bug in Telephony Assistant / 提交电话助手的可复现问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please report security vulnerabilities privately through [SECURITY.md](https://github.com/sunnyhmz7010/vocat-plugin-telephony/blob/main/SECURITY.md).
        感谢你反馈问题。安全漏洞请按 SECURITY.md 私下报告；不要上传密码、Cookie、Authorization、推送密钥、完整电话号码或通话录音。

  - type: textarea
    id: summary
    attributes:
      label: Bug Summary / 问题概述
      description: Describe the affected feature and what went wrong. / 请说明受影响的功能和问题。
      placeholder: e.g. SIP registration fails after saving gateway settings. / 例如保存网关设置后 SIP 注册失败。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce / 复现步骤
      description: List the shortest reproducible steps, including relevant settings with secrets removed. / 请提供最小复现步骤及脱敏后的相关设置。
      placeholder: |
        1. ...
        2. ...
        3. See error / 出现错误 ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin Version / 插件版本
      description: Telephony Assistant release version or commit hash. / 电话助手发布版本或 commit hash。
      placeholder: e.g. 0.1.4 or commit hash / 例如 0.1.4 或 commit hash
    validations:
      required: true

  - type: input
    id: vocat-version
    attributes:
      label: VoCat Version / VoCat 版本
      description: Include the host VoCat version or commit hash. / 请填写宿主 VoCat 版本或 commit hash。
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Operating Mode / 运行模式
      description: Select the mode configured in the plugin settings. / 请选择插件设置中的运行模式。
      options:
        - Panel mode / 面板模式
        - Server mode / 服务端模式
        - Unable to determine / 无法确认
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment / 运行环境
      description: Include Linux distribution, arm64/amd64 architecture, deployment method, and browser version for panel issues. For source builds, include the Go version. / 请填写 Linux 发行版、arm64/amd64 架构和部署方式；面板问题补充浏览器版本，自行构建补充 Go 版本。
      placeholder: |
        Host OS and architecture / 宿主系统与架构：
        Installation or upgrade method / 安装或升级方式：
        Browser and version, if relevant / 浏览器及版本（如适用）：
        Go version for source builds / 源码构建所用 Go 版本：
    validations:
      required: true

  - type: textarea
    id: sip-client
    attributes:
      label: SIP Client / SIP 客户端
      description: For SIP issues, include the client name/version, transport, and Digest algorithm. The gateway uses UDP and SHA-256 Digest. Do not paste authentication headers or passwords. / SIP 问题请填写客户端名称/版本、传输方式和 Digest 算法。网关使用 UDP 与 SHA-256 Digest；不要粘贴认证头或密码。
      placeholder: |
        Client and version / 客户端及版本：
        Transport / 传输方式：
        Digest algorithm / Digest 算法：
        Network topology, with identifying details removed / 脱敏后的网络拓扑：

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior / 期望行为
      description: What should have happened? / 你期望的结果是什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / 实际行为
      description: What happened, including the visible error and whether it occurs every time? / 实际发生了什么？请附界面错误并说明是否每次出现。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized Logs or Screenshots / 脱敏日志或截图
      description: Include the relevant time range and error context. Remove credentials, cookies, authentication headers, notification tokens, phone numbers, and recordings. / 请保留相关时段与错误上下文，并移除凭据、Cookie、认证头、推送令牌、电话号码及录音。

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist / 提交前确认
      options:
        - label: I have searched existing issues before submitting this report. / 我已先搜索过现有 Issue。
          required: true
        - label: I have removed sensitive information from the report and attachments. / 我已移除报告与附件中的敏感信息。
          required: true
