name: Feature Request / 功能建议
description: Suggest a feature or improvement for Telephony Assistant / 提交电话助手的新功能或改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea. Describe the call-management problem you want to solve; remove private phone numbers, credentials, and recordings.
        感谢你提出建议。请说明希望解决的通话管理问题，并移除私人号码、凭据与录音。

  - type: textarea
    id: use-case
    attributes:
      label: Use Case / 使用场景
      description: What are you trying to do, and where is the current pain point? / 你想做什么，当前卡点在哪里？
      placeholder: Include the operating mode and relevant VoCat or SIP client constraints. / 请补充面板或服务端模式，以及相关 VoCat 或 SIP 客户端限制。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Expected Improvement / 期望改进
      description: What would you like Telephony Assistant to do? / 你希望电话助手怎么做？
      placeholder: Describe the feature or behavior you want. / 描述你希望新增的功能或行为。

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered / 备选方案
      description: Can VoCat's existing features, plugin settings, or a SIP client meet the need? / VoCat 内置功能、插件现有设置或 SIP 客户端是否能满足需求？

  - type: textarea
    id: context
    attributes:
      label: Additional Context / 补充信息
      description: Add relevant versions, examples, or sanitized screenshots. / 可补充相关版本、示例或脱敏截图。

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist / 提交前确认
      options:
        - label: I have searched existing issues before submitting this request. / 我已先搜索过现有 Issue。
          required: true
        - label: I have removed sensitive information from the request and attachments. / 我已移除建议与附件中的敏感信息。
          required: true
